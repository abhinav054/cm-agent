[project]
name = "mate"
version = "0.1.0"
description = "Mate, a small OpenAI-compatible terminal coding companion with local file tools and curl-based browsing."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
mate = "agent_terminal.main:main"
agent-terminal = "agent_terminal.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
